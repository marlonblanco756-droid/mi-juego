<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konoha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 20px;
  }
  h1 { color: #f97316; margin-bottom: 4px; font-size: 1.8rem; text-align:center; }
  .sub { color: #94a3b8; font-size: .85rem; margin-bottom: 20px; text-align:center; }
  .panel {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    padding: 20px; width: 100%; max-width: 460px; margin-bottom: 16px;
  }
  .oculto { display: none !important; }

  #pantallaLogin { margin-top: 40px; }
  #pantallaLogin h2 { font-size:1.1rem; color:#f97316; margin-bottom:14px; text-align:center; }
  #pantallaLogin label { display:block; font-size:.85rem; color:#94a3b8; margin-bottom:6px; margin-top:12px; }
  #pantallaLogin input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #475569; background: #0f172a;
    color: #e2e8f0; font-size: 1rem;
  }
  #pantallaLogin button {
    width: 100%; margin-top: 16px; padding: 12px;
    border-radius: 10px; border: none; background: #f97316;
    color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  #pantallaLogin button:hover { background: #fb923c; }
  #pantallaLogin .btn-wa {
    background: transparent; border: 1px solid #22c55e;
    color: #22c55e; margin-top: 10px;
  }
  #pantallaLogin .btn-wa:hover { background: #22c55e; color: #0f172a; }
  #loginError { color: #ef4444; font-size: .85rem; margin-top: 10px; text-align:center; min-height: 20px; }

  #pantallaApp { width: 100%; max-width: 460px; }
  .barra-superior {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 460px; margin-bottom: 12px;
  }
  .barra-superior .usuario { font-size: .85rem; color: #94a3b8; }
  .barra-superior .usuario strong { color: #f97316; }
  .barra-superior button {
    background: transparent; border: 1px solid #ef4444; color: #ef4444;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: .8rem;
  }
  .barra-superior button:hover { background: #ef4444; color: #0f172a; }

  .monedas {
    text-align: center; font-size: 2rem; font-weight: 700;
    color: #22c55e; margin-bottom: 12px;
  }
  .monedas small { display:block; font-size:.75rem; color:#94a3b8; font-weight:400; }

  label { display:block; font-size:.85rem; color:#94a3b8; margin-bottom:6px; }
  input[type="number"], .canje input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #475569; background: #0f172a;
    color: #e2e8f0; font-size: 1rem;
  }
  .canje { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }
  .canje input { flex: 1; background: #1e293b; }
  .canje button, .btn-accion {
    padding: 10px 16px; border-radius: 8px; border: none;
    background: #f97316; color: #0f172a; font-weight: 700; cursor: pointer;
  }
  .canje button:hover, .btn-accion:hover { background: #fb923c; }

  .btn-recargar {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #22c55e; background: transparent;
    color: #22c55e; font-size: .95rem; cursor: pointer; margin-top: 8px;
  }
  .btn-recargar:hover { background: #22c55e; color: #0f172a; }

  .btn-retirar {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #f97316; background: transparent;
    color: #f97316; font-size: .95rem; cursor: pointer; margin-top: 8px;
  }
  .btn-retirar:hover { background: #f97316; color: #0f172a; }

  .btn-ir-jugar {
    display: block; width: 100%; padding: 14px; border-radius: 10px;
    border: none; background: #f97316; color: #0f172a;
    font-weight: 700; font-size: 1rem; text-align: center;
    text-decoration: none; margin-top: 8px;
  }
  .btn-ir-jugar:hover { background: #fb923c; }

  .nota { font-size:.75rem; color:#64748b; text-align:center; margin-top:12px; }
  .estado { text-align: center; min-height: 40px; margin-top: 8px; font-size: .95rem; }
  .gana { color: #22c55e; font-weight: 700; }
  .error { color: #ef4444; }
  .codigo-box {
    word-break: break-all; font-size: .75rem; color: #94a3b8;
    margin-top: 8px; background: #0f172a; padding: 10px;
    border-radius: 8px; border: 1px dashed #475569;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="pantallaLogin" class="panel">
  <h2>🔐 Iniciar sesión en Konoha</h2>
  <p class="sub" style="margin-bottom:0;">Necesitas un usuario y contraseña para entrar.</p>

  <label>Nombre de usuario</label>
  <input id="loginUser" placeholder="Tu usuario">

  <label>Contraseña</label>
  <input id="loginPass" type="password" placeholder="Tu contraseña">

  <button id="btnLogin">Entrar</button>
  <button id="btnPedirCredenciales" class="btn-wa">💬 Pedir usuario y contraseña por WhatsApp</button>
  <div id="loginError"></div>
</div>

<!-- APP: canje + retiro + ir a jugar -->
<div id="pantallaApp" class="oculto">

  <div class="barra-superior">
    <div class="usuario">Hola, <strong id="nombreUsuario">—</strong></div>
    <button id="btnSalir">Salir</button>
  </div>

  <div class="panel">
    <div class="monedas">
      <span id="monedasDisplay">0</span>
      <small>monedas disponibles</small>
    </div>

    <!-- CANJE -->
    <label>Código de recarga</label>
    <div class="canje">
      <input id="inputCodigo" placeholder="Ej: RC-USU1">
      <button id="btnCanjear">Canjear</button>
    </div>
    <div id="canjeMensaje" class="estado"></div>

    <p class="nota">¿No tienes código? Pídelo por WhatsApp después de recargar.</p>
    <button class="btn-recargar" id="btnRecargar">💬 Recargar por WhatsApp</button>

    <!-- RETIRO -->
    <label style="margin-top:18px;">Cantidad a retirar (mínimo 50)</label>
    <input type="number" id="inputRetiro" placeholder="Ej: 100" min="50" step="10">
    <button class="btn-retirar" id="btnRetirar">💸 Generar código de retiro</button>
    <div id="retiroMensaje" class="estado"></div>
    <div id="codigoRetiro" class="codigo-box" style="display:none;"></div>

    <a class="btn-ir-jugar" href="juego.html">🎮 Ir a Jugar</a>
  </div>

</div>

<script>
/* ============ USUARIOS ============ */
const USUARIOS = {
  "Marlon":  "konoha123",
  "Sasuke":  "uchiha456",
  "Naruto":  "hokage789",
  "Sakura":  "haruno000",
  "Kakashi": "sensei111"
};

/* ============ CÓDIGOS ============ */
const CODIGOS = {
  "RC-KONOHA-7X2": 120, "RC-USU1": 120, "RC-FIRE-9Q": 120,
  "RC-USU2": 240, "RC-LEAF-3M": 240, "RC-SHADOW-8P": 240,
  "RC-USU3": 360, "RC-STORM-5K": 360, "RC-BLADE-2W": 360,
  "RC-USU4": 480, "RC-SAGE-6R": 480, "RC-SCROLL-1T": 480,
  "RC-USU5": 600, "RC-RASEN-4L": 600, "RC-CHAKRA-9N": 600,
  "RC-USU6": 720, "RC-HOKAGE-7Z": 720, "RC-ANBU-3V": 720
};

/* ============ localStorage ============ */
let usuarioActual = null;
const kMonedas   = () => "konoha_monedas_"   + usuarioActual;
const kCanjeados = () => "konoha_canjeados_" + usuarioActual;
const kRegistro  = () => "konoha_registro_"  + usuarioActual;

function getMonedas() { return parseInt(localStorage.getItem(kMonedas()) || "0", 10); }
function setMonedas(n) {
  localStorage.setItem(kMonedas(), String(Math.max(0, Math.floor(n))));
  renderMonedas();
}
function getCanjeados() {
  try { return JSON.parse(localStorage.getItem(kCanjeados()) || "[]"); } catch { return []; }
}
function addCanjeado(c) {
  const l = getCanjeados(); l.push(c);
  localStorage.setItem(kCanjeados(), JSON.stringify(l));
}
function getRegistro() { return parseInt(localStorage.getItem(kRegistro()) || "0", 10); }
function setRegistro(n) { localStorage.setItem(kRegistro(), String(Math.floor(n))); }

/* ============ DOM ============ */
const $pantallaLogin = document.getElementById("pantallaLogin");
const $pantallaApp   = document.getElementById("pantallaApp");
const $loginUser     = document.getElementById("loginUser");
const $loginPass     = document.getElementById("loginPass");
const $loginError    = document.getElementById("loginError");
const $nombreUsuario = document.getElementById("nombreUsuario");
const $monedas       = document.getElementById("monedasDisplay");
const $inputCodigo   = document.getElementById("inputCodigo");
const $canjeMensaje  = document.getElementById("canjeMensaje");
const $inputRetiro   = document.getElementById("inputRetiro");
const $retiroMensaje = document.getElementById("retiroMensaje");
const $codigoRetiro  = document.getElementById("codigoRetiro");

function renderMonedas() {
  $monedas.textContent = getMonedas().toLocaleString("es-ES");
}

/* ============ LOGIN ============ */
function iniciarSesion() {
  const user = $loginUser.value.trim();
  const pass = $loginPass.value;
  if (!user || !pass) { $loginError.textContent = "Escribe usuario y contraseña."; return; }
  if (!(user in USUARIOS) || USUARIOS[user] !== pass) {
    $loginError.textContent = "Usuario o contraseña incorrectos."; return;
  }
  usuarioActual = user;
  localStorage.setItem("konoha_usuario_actual", user);
  $loginError.textContent = "";
  $pantallaLogin.classList.add("oculto");
  $pantallaApp.classList.remove("oculto");
  $nombreUsuario.textContent = user;
  renderMonedas();
}

function cerrarSesion() {
  usuarioActual = null;
  localStorage.removeItem("konoha_usuario_actual");
  $pantallaApp.classList.add("oculto");
  $pantallaLogin.classList.remove("oculto");
  $loginUser.value = ""; $loginPass.value = ""; $loginError.textContent = "";
}

document.getElementById("btnLogin").addEventListener("click", iniciarSesion);
$loginPass.addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
document.getElementById("btnSalir").addEventListener("click", cerrarSesion);

document.getElementById("btnPedirCredenciales").addEventListener("click", () => {
  const numero = "54530303";
  const mensaje = encodeURIComponent("Hola, quiero pedir un nombre de usuario y contraseña para jugar a Konoha.");
  window.open(`https://wa.me/${numero}?text=${mensaje}`, "_blank");
});

/* ============ CANJE ============ */
document.getElementById("btnCanjear").addEventListener("click", () => {
  if (!usuarioActual) return;
  const codigo = $inputCodigo.value.trim().toUpperCase();
  if (!codigo) { $canjeMensaje.innerHTML = '<span class="error">Escribe un código.</span>'; return; }
  if (getCanjeados().includes(codigo)) {
    $canjeMensaje.innerHTML = '<span class="error">Ese código ya fue canjeado.</span>'; return;
  }
  if (!(codigo in CODIGOS)) {
    $canjeMensaje.innerHTML = '<span class="error">Código inválido.</span>'; return;
  }
  const monto = CODIGOS[codigo];
  setMonedas(getMonedas() + monto);
  setRegistro(getRegistro() + monto);   // suma al registro
  addCanjeado(codigo);
  $inputCodigo.value = "";
  $canjeMensaje.innerHTML = `<span class="gana">✅ Canjeado: +${monto} monedas.</span>`;
});

document.getElementById("btnRecargar").addEventListener("click", () => {
  const numero = "54530303";
  const mensaje = encodeURIComponent("Quiero recargar");
  window.open(`https://wa.me/${numero}?text=${mensaje}`, "_blank");
});

/* ============ RETIRO ============ */
function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function hashSimple(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h).toString(36);
}

document.getElementById("btnRetirar").addEventListener("click", () => {
  if (!usuarioActual) return;

  const cantidad = parseInt($inputRetiro.value, 10);
  const saldoReal = getMonedas();
  const registros = getRegistro();

  if (!cantidad || cantidad < 50) {
    $retiroMensaje.innerHTML = '<span class="error">Mínimo de retiro: 50 monedas.</span>';
    $codigoRetiro.style.display = "none";
    return;
  }
  if (cantidad > saldoReal) {
    $retiroMensaje.innerHTML = '<span class="error">No puedes retirar más de tu saldo real.</span>';
    $codigoRetiro.style.display = "none";
    return;
  }

  const fecha = new Date().toLocaleString("es-ES");

  // Datos en orden normal: usuario | cantidad deseada | registros | fecha | saldo real
  const datos = [usuarioActual, cantidad, registros, fecha, saldoReal];
  const datosAlReves = [...datos].reverse().join("|");

  const cuerpo = b64(datosAlReves);
  const firma = hashSimple(datosAlReves + "konoha_secret");
  const codigo = "RET-" + cuerpo + "-" + firma;

  $retiroMensaje.innerHTML = '<span class="gana">✅ Código generado. Envíalo por WhatsApp.</span>';
  $codigoRetiro.textContent = codigo;
  $codigoRetiro.style.display = "block";

  // Registrar la operación de retiro
  setRegistro(registros - cantidad);
});
</script>
</body>
</html>

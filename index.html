<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konoha - Piedra Papel Tijera</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #f97316; margin-bottom: 4px; font-size: 1.8rem; }
  .sub { color: #94a3b8; font-size: .85rem; margin-bottom: 20px; }

  .panel {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 460px;
    margin-bottom: 16px;
  }

  .monedas {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    color: #22c55e;
    margin-bottom: 12px;
  }
  .monedas small { display:block; font-size:.75rem; color:#94a3b8; font-weight:400; }

  label { display:block; font-size:.85rem; color:#94a3b8; margin-bottom:6px; }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
    margin-bottom: 12px;
  }

  .botones-juego {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 8px;
  }
  .botones-juego button {
    padding: 16px 8px;
    font-size: 1.6rem;
    border: 2px solid #475569;
    border-radius: 12px;
    background: #0f172a;
    color: #e2e8f0;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .botones-juego button span { font-size: .7rem; color:#94a3b8; }
  .botones-juego button:hover:not(:disabled) {
    border-color: #f97316;
    background: #1e293b;
    transform: translateY(-2px);
  }
  .botones-juego button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
  }

  .estado {
    text-align: center;
    min-height: 60px;
    margin-top: 14px;
    font-size: .95rem;
    line-height: 1.5;
  }
  .estado .pensando { color: #fbbf24; animation: pulse 1s infinite; }
  .gana { color: #22c55e; font-weight: 700; }
  .pierde { color: #ef4444; font-weight: 700; }
  .empata { color: #fbbf24; font-weight: 700; }
  .error { color: #ef4444; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .historial {
    width: 100%;
    max-width: 460px;
    font-size: .8rem;
    color: #94a3b8;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 14px;
    max-height: 180px;
    overflow-y: auto;
  }
  .historial h3 { font-size: .85rem; color:#cbd5e1; margin-bottom:8px; }
  .historial div { padding: 4px 0; border-bottom: 1px solid #334155; }
  .historial div:last-child { border-bottom: none; }

  .btn-recargar {
    width: 100%;
    max-width: 460px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #22c55e;
    background: transparent;
    color: #22c55e;
    font-size: .95rem;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all .15s;
  }
  .btn-recargar:hover { background: #22c55e; color: #0f172a; }

  .canje {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 460px;
    margin-bottom: 16px;
  }
  .canje input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #e2e8f0;
  }
  .canje button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #f97316;
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
  }
  .canje button:hover { background: #fb923c; }
</style>
</head>
<body>

<h1>🍃 Konoha</h1>
<p class="sub">Piedra · Papel · Tijera — Apuesta y multiplica</p>

<div class="panel">
  <div class="monedas">
    <span id="monedasDisplay">0</span>
    <small>monedas disponibles</small>
  </div>

  <label>Apuesta (mínimo 50)</label>
  <input type="number" id="inputApuesta" value="50" min="50" step="10">

  <div class="botones-juego">
    <button data-jugada="piedra" disabled>✊<span>Piedra</span></button>
    <button data-jugada="papel"  disabled>✋<span>Papel</span></button>
    <button data-jugada="tijera" disabled>✌️<span>Tijera</span></button>
  </div>

  <div class="estado" id="estado">Elige una apuesta y pulsa un botón cuando estén habilitados.</div>
</div>

<div class="canje">
  <input id="inputCodigo" placeholder="Introduce tu código de recarga">
  <button id="btnCanjear">Canjear</button>
</div>

<button class="btn-recargar" id="btnRecargar">💬 Recargar por WhatsApp</button>

<div class="historial" id="historial">
  <h3>Historial</h3>
</div>

<script>
/* ============================================================
   1. CÓDIGOS DE RECARGA (3 por monto, desordenados)
   ============================================================ */
const CODIGOS = {
  // 120
  "RC-KONOHA-7X2": 120,
  "RC-USU1":       120,
  "RC-FIRE-9Q":    120,
  // 240
  "RC-USU2":       240,
  "RC-LEAF-3M":    240,
  "RC-SHADOW-8P":  240,
  // 360
  "RC-USU3":       360,
  "RC-STORM-5K":   360,
  "RC-BLADE-2W":   360,
  // 480
  "RC-USU4":       480,
  "RC-SAGE-6R":    480,
  "RC-SCROLL-1T":  480,
  // 600
  "RC-USU5":       600,
  "RC-RASEN-4L":   600,
  "RC-CHAKRA-9N":  600,
  // 720
  "RC-USU6":       720,
  "RC-HOKAGE-7Z":  720,
  "RC-ANBU-3V":    720
};

/* ============================================================
   2. localStorage
   ============================================================ */
const KEY_MONEDAS   = "konoha_monedas";
const KEY_CANJEADOS = "konoha_canjeados";
const KEY_HISTORIAL = "konoha_historial";

function getMonedas() {
  return parseInt(localStorage.getItem(KEY_MONEDAS) || "0", 10);
}
function setMonedas(n) {
  localStorage.setItem(KEY_MONEDAS, String(Math.max(0, Math.floor(n))));
  renderMonedas();
}
function getCanjeados() {
  try { return JSON.parse(localStorage.getItem(KEY_CANJEADOS) || "[]"); }
  catch { return []; }
}
function addCanjeado(c) {
  const l = getCanjeados(); l.push(c);
  localStorage.setItem(KEY_CANJEADOS, JSON.stringify(l));
}
function getHistorial() {
  try { return JSON.parse(localStorage.getItem(KEY_HISTORIAL) || "[]"); }
  catch { return []; }
}
function addHistorial(entry) {
  const l = getHistorial(); l.unshift(entry);
  localStorage.setItem(KEY_HISTORIAL, JSON.stringify(l.slice(0, 30)));
  renderHistorial();
}

/* ============================================================
   3. Render
   ============================================================ */
const $monedas   = document.getElementById("monedasDisplay");
const $estado    = document.getElementById("estado");
const $historial = document.getElementById("historial");
const $inputApuesta = document.getElementById("inputApuesta");
const botonesJuego  = document.querySelectorAll(".botones-juego button");

function renderMonedas() {
  $monedas.textContent = getMonedas().toLocaleString("es-ES");
}
function renderHistorial() {
  const h = getHistorial();
  $historial.innerHTML = "<h3>Historial</h3>" +
    (h.length === 0 ? "<div>Sin jugadas aún.</div>" :
      h.map(e => `<div>${e.texto}</div>`).join(""));
}
function setEstado(html, clase = "") {
  $estado.innerHTML = `<span class="${clase}">${html}</span>`;
}
function bloquearBotones(bloquear) {
  botonesJuego.forEach(b => b.disabled = bloquear);
}

/* ============================================================
   4. Lógica del juego
   ============================================================ */
const JUGADAS = ["piedra", "papel", "tijera"];
const EMOJI = { piedra: "✊", papel: "✋", tijera: "✌️" };

function jugadaAleatoria() {
  return JUGADAS[Math.floor(Math.random() * 3)];
}

// Devuelve "gana" | "pierde" | "empata" desde el punto de vista del jugador
function resolver(jugador, compu) {
  if (jugador === compu) return "empata";
  if (
    (jugador === "piedra" && compu === "tijera") ||
    (jugador === "papel"  && compu === "piedra") ||
    (jugador === "tijera" && compu === "papel")
  ) return "gana";
  return "pierde";
}

let jugando = false;

function iniciarJugada(jugador) {
  if (jugando) return;

  const apuesta = parseInt($inputApuesta.value, 10);
  if (!apuesta || apuesta < 50) {
    setEstado("La apuesta mínima es 50 monedas.", "error");
    return;
  }
  if (apuesta > getMonedas()) {
    setEstado("No tienes suficientes monedas para esa apuesta.", "error");
    return;
  }

  jugando = true;
  bloquearBotones(true);

  // Descontar apuesta ya (se devuelve según resultado)
  setMonedas(getMonedas() - apuesta);

  // La computadora "piensa" entre 2 y 5 segundos
  const delay = 2000 + Math.floor(Math.random() * 3000); // 2000-5000 ms
  setEstado(`🤖 La computadora está pensando<span class="pensando">...</span>`, "pensando");

  setTimeout(() => {
    const compu = jugadaAleatoria();
    const resultado = resolver(jugador, compu);

    let ganancia = 0;
    let textoResultado = "";
    let clase = "";

    if (resultado === "gana") {
      ganancia = Math.floor(apuesta * 1.8); // x1.80
      textoResultado = `¡Ganaste! ${EMOJI[jugador]} vs ${EMOJI[compu]} → +${ganancia}`;
      clase = "gana";
    } else if (resultado === "empata") {
      ganancia = Math.floor(apuesta * 0.8); // x0.80 (recuperas 80%)
      textoResultado = `Empate ${EMOJI[jugador]} vs ${EMOJI[compu]} → recuperas ${ganancia}`;
      clase = "empata";
    } else {
      ganancia = 0;
      textoResultado = `Perdiste ${EMOJI[jugador]} vs ${EMOJI[compu]} → -${apuesta}`;
      clase = "pierde";
    }

    setMonedas(getMonedas() + ganancia);

    setEstado(
      `${textoResultado}<br><small>Computadora eligió: ${EMOJI[compu]} ${compu}</small>`,
      clase
    );

    addHistorial({
      texto: `${new Date().toLocaleTimeString("es-ES")} — Tú ${EMOJI[jugador]} vs ${EMOJI[compu]} → ${resultado} (${ganancia >= 0 ? "+" : ""}${ganancia - apuesta})`
    });

    jugando = false;
    bloquearBotones(false);
  }, delay);
}

/* ============================================================
   5. Eventos
   ============================================================ */
botonesJuego.forEach(btn => {
  btn.addEventListener("click", () => iniciarJugada(btn.dataset.jugada));
});

// Canje de códigos
document.getElementById("btnCanjear").addEventListener("click", () => {
  const input = document.getElementById("inputCodigo");
  const codigo = input.value.trim().toUpperCase();
  if (!codigo) { setEstado("Escribe un código.", "error"); return; }

  const canjeados = getCanjeados();
  if (canjeados.includes(codigo)) {
    setEstado("Ese código ya fue canjeado.", "error");
    return;
  }
  if (!(codigo in CODIGOS)) {
    setEstado("Código inválido.", "error");
    return;
  }

  const monto = CODIGOS[codigo];
  setMonedas(getMonedas() + monto);
  addCanjeado(codigo);
  input.value = "";
  setEstado(`✅ Código canjeado: +${monto} monedas.`, "gana");
});

// Botón WhatsApp
document.getElementById("btnRecargar").addEventListener("click", () => {
  const numero = "54530303";
  const mensaje = encodeURIComponent("Quiero recargar");
  window.open(`https://wa.me/${numero}?text=${mensaje}`, "_blank");
});

// Inicial
renderMonedas();
renderHistorial();
</script>
</body>
</html>

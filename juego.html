<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konoha - Jugar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 20px;
  }
  h1 { color: #f97316; margin-bottom: 4px; font-size: 1.8rem; text-align:center; }
  .sub { color: #94a3b8; font-size: .85rem; margin-bottom: 20px; text-align:center; }

  .panel {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    padding: 20px; width: 100%; max-width: 460px; margin-bottom: 16px;
  }

  .barra-superior {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 460px; margin-bottom: 12px;
  }
  .barra-superior .usuario { font-size: .85rem; color: #94a3b8; }
  .barra-superior .usuario strong { color: #f97316; }
  .barra-superior a {
    background: transparent; border: 1px solid #f97316; color: #f97316;
    padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: .8rem;
  }
  .barra-superior a:hover { background: #f97316; color: #0f172a; }

  .monedas {
    text-align: center; font-size: 2rem; font-weight: 700;
    color: #22c55e; margin-bottom: 12px;
  }
  .monedas small { display:block; font-size:.75rem; color:#94a3b8; font-weight:400; }

  label { display:block; font-size:.85rem; color:#94a3b8; margin-bottom:6px; }
  input[type="number"] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #475569; background: #0f172a;
    color: #e2e8f0; font-size: 1rem; margin-bottom: 12px;
  }

  .botones-juego {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 8px;
  }
  .botones-juego button {
    padding: 16px 8px; font-size: 1.6rem;
    border: 2px solid #475569; border-radius: 12px;
    background: #0f172a; color: #e2e8f0; cursor: pointer;
    transition: all .15s; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  .botones-juego button span { font-size: .7rem; color:#94a3b8; }
  .botones-juego button:hover:not(:disabled) {
    border-color: #f97316; background: #1e293b; transform: translateY(-2px);
  }
  .botones-juego button:disabled { opacity: .35; cursor: not-allowed; transform: none; }

  .estado {
    text-align: center; min-height: 60px; margin-top: 14px;
    font-size: .95rem; line-height: 1.5;
  }
  .gana { color: #22c55e; font-weight: 700; }
  .pierde { color: #ef4444; font-weight: 700; }
  .empata { color: #fbbf24; font-weight: 700; }
  .error { color: #ef4444; }

  .historial {
    width: 100%; max-width: 460px; font-size: .8rem; color: #94a3b8;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 14px; padding: 14px; max-height: 180px;
    overflow-y: auto; margin-top: 16px;
  }
  .historial h3 { font-size: .85rem; color:#cbd5e1; margin-bottom:8px; }
  .historial div { padding: 4px 0; border-bottom: 1px solid #334155; }
  .historial div:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="contenido" style="display:none; width:100%; max-width:460px;">
  <h1>🍃 Konoha</h1>
  <p class="sub">Piedra · Papel · Tijera</p>

  <div class="barra-superior">
    <div class="usuario">Hola, <strong id="nombreUsuario">—</strong></div>
    <a href="index.html">← Volver</a>
  </div>

  <div class="panel">
    <div class="monedas">
      <span id="monedasDisplay">0</span>
      <small>monedas disponibles</small>
    </div>

    <label>Apuesta (mínimo 50)</label>
    <input type="number" id="inputApuesta" value="50" min="50" step="10">

    <div class="botones-juego">
      <button data-jugada="piedra">✊<span>Piedra</span></button>
      <button data-jugada="papel">✋<span>Papel</span></button>
      <button data-jugada="tijera">✌️<span>Tijera</span></button>
    </div>

    <div class="estado" id="estado">Elige una apuesta y pulsa un botón.</div>
  </div>

  <div class="historial" id="historial">
    <h3>Historial</h3>
  </div>
</div>

<div id="aviso" class="panel" style="max-width:460px; margin-top:40px; text-align:center;">
  <p>Debes iniciar sesión primero.</p>
  <a href="index.html" style="color:#f97316; font-weight:700;">Ir al login</a>
</div>

<script>
/* ============ Verificar sesión ============ */
const usuarioActual = localStorage.getItem("konoha_usuario_actual");
if (!usuarioActual) {
  document.getElementById("aviso").style.display = "block";
} else {
  document.getElementById("contenido").style.display = "block";
  document.getElementById("aviso").style.display = "none";
  document.getElementById("nombreUsuario").textContent = usuarioActual;
}

/* ============ localStorage por usuario ============ */
const kMonedas   = () => "konoha_monedas_"   + usuarioActual;
const kHistorial = () => "konoha_historial_" + usuarioActual;
const kRegistro  = () => "konoha_registro_"  + usuarioActual;

function getMonedas() { return parseInt(localStorage.getItem(kMonedas()) || "0", 10); }
function setMonedas(n) {
  localStorage.setItem(kMonedas(), String(Math.max(0, Math.floor(n))));
  renderMonedas();
}
function getHistorial() {
  try { return JSON.parse(localStorage.getItem(kHistorial()) || "[]"); } catch { return []; }
}
function addHistorial(e) {
  const l = getHistorial(); l.unshift(e);
  localStorage.setItem(kHistorial(), JSON.stringify(l.slice(0, 30)));
  renderHistorial();
}
function addRegistro(n) {
  const r = parseInt(localStorage.getItem(kRegistro()) || "0", 10);
  localStorage.setItem(kRegistro(), String(r + n));
}

/* ============ DOM ============ */
const $monedas      = document.getElementById("monedasDisplay");
const $estado       = document.getElementById("estado");
const $historial    = document.getElementById("historial");
const $inputApuesta = document.getElementById("inputApuesta");
const botonesJuego  = document.querySelectorAll(".botones-juego button");

function renderMonedas() {
  $monedas.textContent = getMonedas().toLocaleString("es-ES");
}
function renderHistorial() {
  const h = getHistorial();
  $historial.innerHTML = "<h3>Historial</h3>" +
    (h.length === 0 ? "<div>Sin jugadas aún.</div>" : h.map(e => `<div>${e.texto}</div>`).join(""));
}
function setEstado(html, clase = "") {
  $estado.innerHTML = `<span class="${clase}">${html}</span>`;
}

/* ============ Juego (CPU instantánea) ============ */
const JUGADAS = ["piedra", "papel", "tijera"];
const EMOJI = { piedra: "✊", papel: "✋", tijera: "✌️" };

function jugadaAleatoria() { return JUGADAS[Math.floor(Math.random() * 3)]; }

function resolver(jugador, compu) {
  if (jugador === compu) return "empata";
  if (
    (jugador === "piedra" && compu === "tijera") ||
    (jugador === "papel"  && compu === "piedra") ||
    (jugador === "tijera" && compu === "papel")
  ) return "gana";
  return "pierde";
}

function iniciarJugada(jugador) {
  if (!usuarioActual) return;

  const apuesta = parseInt($inputApuesta.value, 10);
  if (!apuesta || apuesta < 50) { setEstado("La apuesta mínima es 50 monedas.", "error"); return; }
  if (apuesta > getMonedas()) { setEstado("No tienes suficientes monedas.", "error"); return; }

  setMonedas(getMonedas() - apuesta);

  const compu = jugadaAleatoria();   // CPU instantánea, sin retraso
  const resultado = resolver(jugador, compu);

  let ganancia = 0, texto = "", clase = "";

  if (resultado === "gana") {
    ganancia = Math.floor(apuesta * 1.8);
    texto = `¡Ganaste! ${EMOJI[jugador]} vs ${EMOJI[compu]} → +${ganancia}`;
    clase = "gana";
  } else if (resultado === "empata") {
    ganancia = Math.floor(apuesta * 0.8);
    texto = `Empate ${EMOJI[jugador]} vs ${EMOJI[compu]} → recuperas ${ganancia}`;
    clase = "empata";
  } else {
    ganancia = 0;
    texto = `Perdiste ${EMOJI[jugador]} vs ${EMOJI[compu]} → -${apuesta}`;
    clase = "pierde";
  }

  setMonedas(getMonedas() + ganancia);
  addRegistro(ganancia - apuesta);   // neto de la jugada
  setEstado(`${texto}<br><small>Computadora eligió: ${EMOJI[compu]} ${compu}</small>`, clase);
  addHistorial({
    texto: `${new Date().toLocaleTimeString("es-ES")} — Tú ${EMOJI[jugador]} vs ${EMOJI[compu]} → ${resultado} (${ganancia - apuesta >= 0 ? "+" : ""}${ganancia - apuesta})`
  });
}

botonesJuego.forEach(btn => {
  btn.addEventListener("click", () => iniciarJugada(btn.dataset.jugada));
});

/* ============ Init ============ */
if (usuarioActual) {
  renderMonedas();
  renderHistorial();
}
</script>
</body>
</html>
